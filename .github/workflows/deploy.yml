name: UniMeal CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  # ─── Job 1: Build & Push Docker Images ──────────────────────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: ./unimeal/backend
          file: ./unimeal/backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/unimeal-backend:latest

      - name: Build and push Frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./unimeal/frontend
          file: ./unimeal/frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/unimeal-frontend:latest

  # ─── Job 2: Deploy to AWS EC2 ───────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build   # Only runs after build job succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest images from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/unimeal-backend:latest
            docker pull ${{ secrets.DOCKER_USERNAME }}/unimeal-frontend:latest

            # Navigate to project directory
            cd ~/unimeal-project

            # Update docker-compose images to use registry versions
            export DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}

            # Stop and restart with new images
            docker compose down
            docker compose up -d

            # Remove old/unused images to save space
            docker image prune -f
